<div class="campo-grupo {% if campo.errors %}campo-invalido{% endif %}">
    {% if campo.field.widget.input_type == "checkbox" %}
        <div class="campo-marcacao">
            {{ campo }}
            <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        </div>
    {% else %}
        <label for="{{ campo.id_for_label }}">
            {{ campo.label }}{% if not campo.field.required %} <span class="campo-opcional">(opcional)</span>{% endif %}
        </label>
        {{ campo }}
    {% endif %}

    {% if campo.help_text %}
        <p class="campo-ajuda" id="ajuda-{{ campo.auto_id }}">{{ campo.help_text }}</p>
    {% endif %}

    {% if campo.errors %}
        <div class="campo-erros" id="erro-{{ campo.auto_id }}" role="alert">
            {% for erro in campo.errors %}<p class="campo-erro">{% icone "alerta" 14 %} {{ erro }}</p>{% endfor %}
        </div>
    {% endif %}
</div>
